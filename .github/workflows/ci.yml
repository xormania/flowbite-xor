name: CI

# Every push to a branch runs CI (so a branch is green before its PR opens); pull_request runs only for forks,
# whose pushes do not reach this repository, to avoid running everything twice. Tag pushes do not run it: release.yml
# checks a release's install before tagging it. Actions are pinned by commit; Dependabot proposes their updates
# (.github/dependabot.yml).
on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    PHP_VERSION: '8.4'
    # Pinned: the toolkit is experimental, bump deliberately (same version as demo/composer.lock).
    UX_TOOLKIT_VERSION: '3.5.1'

jobs:
    lint-kit:
        name: Lint kit
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  tools: composer:v2
                  coverage: none

            - name: Install symfony/ux-toolkit in a scratch directory
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir toolkit && cd toolkit
                  composer require --no-interaction --no-progress --dev "symfony/ux-toolkit:${UX_TOOLKIT_VERSION}"

            # ux-toolkit-kit-lint reports every top-level directory without a manifest.json as an error
            # (demo/, tools/, .github/…), so lint the tree `ux:install` actually downloads: GitHub's
            # archive honors .gitattributes export-ignore exactly like `git archive`.
            - name: Export the kit as GitHub's archive would
              run: |
                  mkdir "$RUNNER_TEMP/kit"
                  git archive HEAD | tar -x -C "$RUNNER_TEMP/kit"
                  echo "Exported:" && ls -A "$RUNNER_TEMP/kit"
                  for path in demo docs tests tools .github package.json package-lock.json playwright.config.ts alert/tests; do
                      if [ -e "$RUNNER_TEMP/kit/$path" ]; then echo "::error::$path is not export-ignored"; exit 1; fi
                  done

            - name: Lint
              run: |
                  "$RUNNER_TEMP/toolkit/vendor/bin/ux-toolkit-kit-lint" "$RUNNER_TEMP/kit"

            - name: Debug (what the toolkit sees in the repository)
              run: |
                  "$RUNNER_TEMP/toolkit/vendor/bin/ux-toolkit-kit-debug" "$GITHUB_WORKSPACE"

    fresh-install:
        name: Fresh install
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  tools: composer:v2
                  coverage: none

            # a fresh Symfony skeleton, set up as README.md says: `ux:install` of a page block and a form block works
            - name: ux:install dashboard-home on a fresh Symfony skeleton
              run: tools/tests/fresh-install.sh

    docker-install:
        name: Fresh install (Symfony Docker, from GitHub)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # the kit as users get it: GitHub's archive of this commit, installed in a fresh Symfony Docker project on
            # the latest Symfony
            - name: ux:install from GitHub in a fresh Symfony Docker project
              env:
                  KIT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
                  KIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
              run: tools/tests/docker-install.sh

    contrast:
        name: Contrast
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Token contrast (tools/contrast/pairs.json, both themes)
              run: node tools/contrast/check.mjs

            - name: The theme recipe ships kit.css unchanged
              run: cmp kit.css theme/assets/styles/flowbite-xor.css

    demo:
        name: Demo + Playwright (${{ matrix.shard }}/3)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 25
        # the browser suite is most of CI's time: three shards, each with its own demo and browser (shard 1 writes the
        # image cache the others read)
        env:
            XDEBUG_MODE: 'off' # compose.override.yaml enables Xdebug's develop mode by default; the tests do not use it
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: npm

            # The demo runs in Symfony Docker (demo/compose.yaml): FrankenPHP in worker mode, PHP 8.5
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build the demo image
              uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
              with:
                  source: ./demo                # bake's working directory: compose files and build context in demo/
                  files: |
                      compose.yaml
                      compose.override.yaml
                  load: true
                  pull: true
                  set: |
                      *.cache-from=type=gha,scope=demo-${{ github.ref }}
                      *.cache-from=type=gha,scope=demo-refs/heads/main
                      ${{ matrix.shard == 1 && format('*.cache-to=type=gha,scope=demo-{0},mode=max', github.ref) || '' }}

            - name: Start the demo (composer install on first start)
              working-directory: demo
              run: docker compose up --wait --no-build

            - name: Sync recipes into the demo
              working-directory: demo
              run: docker compose exec -T php php ../tools/sync-demo

            - name: The synced demo matches what is committed
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      git status --porcelain
                      echo "::error::tools/sync-demo changed files: run it and commit the result"
                      exit 1
                  fi

            - name: Check the demo and build its CSS
              working-directory: demo
              run: |
                  docker compose exec -T php composer validate --no-check-publish --strict   # also fails on a stale composer.lock
                  docker compose exec -T php bin/console tailwind:build

            - name: sync-demo copies what ux:install copies
              working-directory: demo
              run: docker compose exec -T php bash ../tools/tests/sync-demo.sh

            # The browser runs in upstream's Playwright image (see playwright.config.ts), so the
            # screenshots compare with the baselines copied from symfony/ux.
            - name: Install Playwright
              run: |
                  npm ci
                  docker pull "mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")-noble"

            - name: Playwright (smoke + every README example + upstream recipe specs)
              env:
                  DEMO_URL: https://localhost
              run: npx playwright test --shard=${{ matrix.shard }}/3

            - name: Demo logs
              if: failure()
              working-directory: demo
              run: docker compose logs php

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: failure()
              with:
                  name: playwright-report-${{ matrix.shard }}
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
