name: Audit

# Known advisories in the locked npm packages of the Playwright tests: weekly, as advisories appear without any change
# here, and on every pull request that changes the lockfile.
on:
    schedule:
        - cron: '17 6 * * 1'
    pull_request:
        paths: [package.json, package-lock.json, .github/workflows/audit.yml]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    npm-audit:
        name: npm audit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: npm audit --package-lock-only
