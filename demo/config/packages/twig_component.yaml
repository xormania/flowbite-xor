twig_component:
    anonymous_template_directory: 'components/'
    defaults:
        # Namespace & directory for components
        App\Twig\Components\: 'components/'
        # The /lab scenarios' own Live Components ("Lab:*"); templates/components/ only holds synced recipes
        App\Twig\Lab\:
            template_directory: 'lab/components/'
            name_prefix: 'Lab'
